name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Offline agent smoke test
        run: ragent ask "What is the default visibility timeout for an SQS queue?" --offline data/sample
      - name: Validate eval datasets
        run: |
          ragent eval validate
          ragent eval validate --dataset evals/injection.jsonl
      # The gate. Fake embedder + in-memory store on the sample corpus: no model, no database.
      # Raise --min-hit-rate whenever an experiment lands (see docs/EVAL_REPORT.md).
      - name: Offline retrieval eval
        run: ragent eval retrieval --offline data/sample --min-hit-rate 0.90 --out evals/runs/ci-retrieval.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/runs/

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragent
          POSTGRES_PASSWORD: ragent
          POSTGRES_DB: ragent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragent -d ragent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAGENT_DATABASE_URL: postgresql://ragent:ragent@localhost:5432/ragent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Integration tests (pgvector store)
        run: pytest -q -m integration
